<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16a34a">
    <title>Offline · Cozy Corner</title>
    <style>
        body { margin: 0; height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
        .box { text-align: center; padding: 24px; }
        .logo { width: 64px; height: 64px; border-radius: 18px; background: #16a34a; color: #fff; font-size: 28px; font-weight: 800; display: grid; place-items: center; margin: 0 auto 16px; }
        h1 { font-size: 18px; margin: 0 0 6px; }
        p { color: #64748b; font-size: 14px; margin: 0; }
        button { margin-top: 20px; border: 0; background: #16a34a; color: #fff; font-weight: 600; padding: 10px 20px; border-radius: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">C</div>
        <h1>Anda sedang offline</h1>
        <p>Periksa koneksi internet, lalu coba lagi.</p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
